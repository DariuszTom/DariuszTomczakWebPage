name: Build Blazor WebAssembly

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        configuration: [Debug, Release]

    env:
      Solution_Name: DariuszTomczakWebPage.slnx
      Project_Path: DariuszTomczakWebPage/DariuszTomczakWebPage.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install WebAssembly tools
      run: dotnet workload install wasm-tools

    - name: Restore
      run: dotnet restore ${{ env.Solution_Name }}

    - name: Build
      run: dotnet build ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --no-restore

    - name: Test
      run: dotnet test ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --no-build

    - name: Publish
      if: matrix.configuration == 'Release'
      run: dotnet publish ${{ env.Project_Path }} --configuration Release --no-restore --output publish

    - name: Upload build artifacts
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: DariuszTomczakWebPage
        path: publish/wwwroot